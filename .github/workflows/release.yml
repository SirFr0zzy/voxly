name: Release

# Every push to main reads the version in Cargo.toml. If no v<version> tag exists
# yet, it creates that tag and builds installers for all desktop platforms into a
# GitHub release. Pushing a v* tag by hand also builds. Bump the version to release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already released, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag" && git push origin "$tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          # GPU: Metal on Apple Silicon and Vulkan on Linux/Windows are enabled
          # automatically (src-tauri/tauri.{linux,windows}.conf.json).
          - os: ubuntu-22.04
            args: ""
            target: ""
          - os: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # whisper.cpp uses std::filesystem, which needs macOS 10.15 or newer.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libclang-dev cmake \
            libgtk-layer-shell-dev libvulkan-dev

      # Headers and the shader compiler whisper.cpp needs for its Vulkan
      # backend. Sets VULKAN_SDK for the build.
      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, glslc
          vulkan-use-cache: true

      # The official SDK ships glslc on Windows; the action above builds from source there and has no glslc.
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.2.5
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization. Without these secrets the macOS
          # build is simply unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: src-tauri
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Voxly ${{ needs.version.outputs.tag }}
          releaseBody: "Download the installer for your system below."
          releaseDraft: false
          args: ${{ matrix.args }}
